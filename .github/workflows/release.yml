name: Release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TERMKEY_TRUSTED_BUILD: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.trusted_build)) && 'true' || 'false' }}
  TERMKEY_PUBLISH_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}
  TERMKEY_RELEASE_MODE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'tag-production' || (github.event_name == 'workflow_dispatch' && inputs.trusted_build) && 'trusted-validation' || 'unsigned-dry-run' }}
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      trusted_build:
        description: Sign, notarize, and verify without publishing
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: termkey-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release source
    runs-on: macos-15
    outputs:
      release_version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - name: Resolve validated release version
        id: release-version
        shell: bash
        env:
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          project_version=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/cli/Cargo.toml | head -n 1)
          if [[ -z "$project_version" ]]; then
            echo "Could not resolve the project version" >&2
            exit 1
          fi
          
          node scripts/validate-release-version.mjs "${TAG_VERSION:-v$project_version}"
          echo "version=$project_version" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run validate
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit Rust dependencies
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo audit --file Cargo.lock
  platforms:
    needs: validate
    uses: ./.github/workflows/native-validation.yml
    with:
      artifact_suffix: release
  plan:
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ steps.targets.outputs.macos }}
      portable: ${{ steps.targets.outputs.portable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - id: targets
        shell: bash
        run: "node -e 'const fs=require(\"node:fs\"); const all=JSON.parse(fs.readFileSync(\"scripts/release-targets.json\",\"utf8\")); for(const [name,include] of Object.entries({macos:all.filter(t=>t.os===\"macos\"),portable:all.filter(t=>t.os!==\"macos\")})){fs.appendFileSync(process.env.GITHUB_OUTPUT, name+\"=\"+JSON.stringify({include})+\"\\n\");}' "
  build:
    name: Sign and package ${{ matrix.target }} — ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'tag-production' || (github.event_name == 'workflow_dispatch' && inputs.trusted_build) && 'trusted-validation' || 'unsigned-dry-run' }}
    needs:
      - validate
      - platforms
      - plan
    runs-on: ${{ matrix.runner }}
    environment:
      name: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.trusted_build)) && 'apple-release-validation' || 'unsigned-dry-run' }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
      TARGET: ${{ matrix.target }}
      ARCHIVE_NAME: ${{ matrix.archive }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      MACOS_ARCH: ${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Verify exact release source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Download tested native binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: termkey-binary-${{ matrix.target }}-release
          path: release-input
      - name: Restore executable permission
        shell: bash
        run: chmod 755 release-input/termkey
      - name: Summarize release mode
        shell: bash
        run: |
          case "$TERMKEY_RELEASE_MODE" in
            unsigned-dry-run)
              mode_description='Unsigned validation artifacts; no credentials or publishing.'
              ;;
            trusted-validation)
              mode_description='Signed, notarized, and verified artifacts; publishing is disabled.'
              ;;
            tag-production)
              mode_description='Signed, notarized, verified, and eligible for gated publication.'
              ;;
            *)
              echo "Unknown release mode: $TERMKEY_RELEASE_MODE" >&2
              exit 1
              ;;
          esac
          {
            echo "## Release mode: $TERMKEY_RELEASE_MODE"
            echo
            echo "$mode_description"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Configure unsigned dry run
        if: env.TERMKEY_TRUSTED_BUILD == 'false'
        shell: bash
        run: echo "TERMKEY_RELEASE_SIGNING=disabled" >> "$GITHUB_ENV"
      - name: Check trusted build credentials
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for secret_name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_APPLICATION_SIGNING_IDENTITY \
            APPLE_INSTALLER_SIGNING_IDENTITY \
            APPLE_NOTARY_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_TEAM_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required secret: $secret_name" >&2
              missing=1
            fi
          done
          exit "$missing"
      - name: Configure ephemeral Apple credentials
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/termkey-signing.p12"
          keychain_path="$RUNNER_TEMP/termkey-signing.keychain-db"
          notary_key_path="$RUNNER_TEMP/AuthKey_$APPLE_NOTARY_KEY_ID.p8"
          original_keychains_path="$RUNNER_TEMP/termkey-original-keychains.txt"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          umask 077
          
          {
            echo "APPLE_CERTIFICATE_PATH=$certificate_path"
            echo "APPLE_KEYCHAIN_PATH=$keychain_path"
            echo "APPLE_NOTARY_KEY_PATH=$notary_key_path"
            echo "APPLE_ORIGINAL_KEYCHAINS_PATH=$original_keychains_path"
          } >> "$GITHUB_ENV"
          
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$notary_key_path"
          
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          
          keychain_search_list=$(security list-keychains -d user)
          : > "$original_keychains_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain=${existing_keychain#"${existing_keychain%%[![:space:]]*}"}
            existing_keychain=${existing_keychain%"${existing_keychain##*[![:space:]]}"}
            if [[ "${existing_keychain:0:1}" == '"' && "${existing_keychain: -1}" == '"' ]]; then
              existing_keychain=${existing_keychain#\"}
              existing_keychain=${existing_keychain%\"}
            fi
            if [[ -n "$existing_keychain" ]]; then
              existing_keychains+=("$existing_keychain")
              printf '%s\n' "$existing_keychain" >> "$original_keychains_path"
            fi
          done <<< "$keychain_search_list"
          security list-keychains -d user -s "${existing_keychains[@]}" "$keychain_path"
          
          case "$APPLE_APPLICATION_SIGNING_IDENTITY" in
            "Developer ID Application: "*) ;;
            *) echo "APPLE_APPLICATION_SIGNING_IDENTITY must be a Developer ID Application identity" >&2; exit 1 ;;
          esac
          case "$APPLE_INSTALLER_SIGNING_IDENTITY" in
            "Developer ID Installer: "*) ;;
            *) echo "APPLE_INSTALLER_SIGNING_IDENTITY must be a Developer ID Installer identity" >&2; exit 1 ;;
          esac
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_TEAM_ID must be exactly 10 uppercase alphanumeric characters" >&2
            exit 1
          fi
          if [[ "$APPLE_APPLICATION_SIGNING_IDENTITY" != *" ($APPLE_TEAM_ID)" ]]; then
            echo "APPLE_APPLICATION_SIGNING_IDENTITY does not match APPLE_TEAM_ID" >&2
            exit 1
          fi
          if [[ "$APPLE_INSTALLER_SIGNING_IDENTITY" != *" ($APPLE_TEAM_ID)" ]]; then
            echo "APPLE_INSTALLER_SIGNING_IDENTITY does not match APPLE_TEAM_ID" >&2
            exit 1
          fi
          
          application_identities=$(security find-identity -v -p codesigning "$keychain_path" | sed -nE 's/^[[:space:]]*[0-9]+\) [[:xdigit:]]+ "(.*)"$/\1/p')
          installer_identities=$(security find-identity -v "$keychain_path" | sed -nE 's/^[[:space:]]*[0-9]+\) [[:xdigit:]]+ "(.*)"$/\1/p')
          if [[ $(printf '%s\n' "$application_identities" | grep -Fxc -- "$APPLE_APPLICATION_SIGNING_IDENTITY") -ne 1 ]]; then
            echo "Configured keychain does not contain the exact application signing identity" >&2
            exit 1
          fi
          if [[ $(printf '%s\n' "$installer_identities" | grep -Fxc -- "$APPLE_INSTALLER_SIGNING_IDENTITY") -ne 1 ]]; then
            echo "Configured keychain does not contain the exact installer signing identity" >&2
            exit 1
          fi
          
          echo "TERMKEY_RELEASE_SIGNING=required" >> "$GITHUB_ENV"
      - name: Sign release binaries
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
        run: |
          release_dir="$GITHUB_WORKSPACE/release-input"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_APPLICATION_SIGNING_IDENTITY" \
            "$release_dir/termkey"
          codesign --verify --strict --verbose=2 "$release_dir/termkey"
      - name: Create signed PKG
        if: (env.TERMKEY_TRUSTED_BUILD == 'true') && matrix.arch == 'arm64'
        shell: bash
        env:
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          TERMKEY_MACOS_ARCH: arm64
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          release_dir="$GITHUB_WORKSPACE/release-input"
          apps/cli/packaging/macos/create-pkg.sh \
            "$release_dir/termkey" \
            "$RELEASE_VERSION" \
            "termkey-macos-aarch64-installer" \
            "$GITHUB_WORKSPACE"
      - name: Create unsigned PKG
        if: (env.TERMKEY_TRUSTED_BUILD == 'false') && matrix.arch == 'arm64'
        shell: bash
        env:
          TERMKEY_MACOS_ARCH: arm64
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          release_dir="$GITHUB_WORKSPACE/release-input"
          apps/cli/packaging/macos/create-pkg.sh \
            "$release_dir/termkey" \
            "$RELEASE_VERSION" \
            "termkey-macos-aarch64-installer" \
            "$GITHUB_WORKSPACE"
      - name: Notarize and staple PKG
        if: (env.TERMKEY_TRUSTED_BUILD == 'true') && matrix.arch == 'arm64'
        shell: bash
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          apps/cli/packaging/macos/notarize-artifact.sh \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64-installer.pkg" \
            pkg
      - name: Create DMG
        shell: bash
        run: |
          apps/cli/packaging/macos/create-dmg.sh \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64-installer.pkg" \
            "termkey-macos-aarch64" \
            "TermKey aarch64-apple-darwin" \
            "$GITHUB_WORKSPACE"
          
          if [[ ! -f "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg" \
            && -f "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg.dmg" ]]; then
            mv "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg.dmg" \
              "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg"
          fi
          test -f "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg"
        if: matrix.arch == 'arm64'
      - name: Sign DMG
        if: (env.TERMKEY_TRUSTED_BUILD == 'true') && matrix.arch == 'arm64'
        shell: bash
        env:
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
        run: |
          codesign --force --timestamp \
            --sign "$APPLE_APPLICATION_SIGNING_IDENTITY" \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg"
          codesign --verify --strict --verbose=2 \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg"
      - name: Notarize and staple DMG
        if: (env.TERMKEY_TRUSTED_BUILD == 'true') && matrix.arch == 'arm64'
        shell: bash
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          apps/cli/packaging/macos/notarize-artifact.sh \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg" \
            dmg
      - name: Create ZIP from release payload
        shell: bash
        run: |
          python3 scripts/package-release.py package --target "$TARGET" --binary "$GITHUB_WORKSPACE/release-input/termkey" --output-dir "$GITHUB_WORKSPACE" --version "$RELEASE_VERSION"
      - name: Notarize ZIP
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          apps/cli/packaging/macos/notarize-artifact.sh "$GITHUB_WORKSPACE/$ARCHIVE_NAME" zip
      - name: Verify signed native ZIP
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 scripts/package-release.py verify --target "$TARGET" --archive "$GITHUB_WORKSPACE/$ARCHIVE_NAME" --run --require-signature --team-id "$APPLE_TEAM_ID"
      - name: Verify trusted release artifacts
        if: (env.TERMKEY_TRUSTED_BUILD == 'true') && matrix.arch == 'arm64'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          apps/cli/packaging/macos/verify-artifacts.sh \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64-installer.pkg" \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg" \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64.zip" \
            "$APPLE_TEAM_ID"
      - name: Verify unsigned dry-run artifacts
        if: env.TERMKEY_TRUSTED_BUILD == 'false'
        shell: bash
        run: |
          python3 scripts/package-release.py verify --target "$TARGET" --archive "$GITHUB_WORKSPACE/$ARCHIVE_NAME" --run
          if [[ "$MACOS_ARCH" == arm64 ]]; then
            pkgutil --payload-files "$GITHUB_WORKSPACE/termkey-macos-aarch64-installer.pkg" | grep -Fqx './usr/local/bin/termkey'
            hdiutil imageinfo "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg" > /dev/null
          fi
      - name: Upload notarization rejection logs
        if: always() && env.TERMKEY_TRUSTED_BUILD == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: termkey-notarization-rejection-logs-${{ matrix.target }}-${{ env.TERMKEY_RELEASE_MODE }}
          path: ${{ runner.temp }}/termkey-notary-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove Apple credentials
        if: always()
        shell: bash
        run: |
          keychain_path=${APPLE_KEYCHAIN_PATH:-"$RUNNER_TEMP/termkey-signing.keychain-db"}
          certificate_path=${APPLE_CERTIFICATE_PATH:-"$RUNNER_TEMP/termkey-signing.p12"}
          original_keychains_path=${APPLE_ORIGINAL_KEYCHAINS_PATH:-"$RUNNER_TEMP/termkey-original-keychains.txt"}
          cleanup_status=0
          if [[ -f "$original_keychains_path" ]]; then
            original_keychains=()
            while IFS= read -r original_keychain || [[ -n "$original_keychain" ]]; do
              if [[ -n "$original_keychain" ]]; then
                original_keychains+=("$original_keychain")
              fi
            done < "$original_keychains_path"
            security list-keychains -d user -s "${original_keychains[@]}" || cleanup_status=$?
          fi
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "$certificate_path" "$original_keychains_path"
          shopt -s nullglob
          notary_key_paths=("$RUNNER_TEMP"/AuthKey_*.p8)
          if (( ${#notary_key_paths[@]} > 0 )); then
            rm -f "${notary_key_paths[@]}"
          fi
          exit "$cleanup_status"
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: termkey-release-${{ matrix.target }}-${{ env.TERMKEY_RELEASE_MODE }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.arch == 'arm64' && 'termkey-macos-aarch64.dmg' || '' }}
          if-no-files-found: error
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.macos) }}
  portable:
    name: Package ${{ matrix.target }}
    needs:
      - validate
      - platforms
      - plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.portable) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Download tested native binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: termkey-binary-${{ matrix.target }}-release
          path: release-input
      - name: Package and verify native ZIP
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
          ARCHIVE_NAME: ${{ matrix.archive }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          PYTHON: ${{ matrix.os == 'windows' && 'python' || 'python3' }}
        run: |
          "$PYTHON" scripts/package-release.py package --target "$TARGET" --binary "release-input/$EXECUTABLE" --output-dir artifacts --version "$RELEASE_VERSION"
          "$PYTHON" scripts/package-release.py verify --target "$TARGET" --archive "artifacts/$ARCHIVE_NAME" --run
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: termkey-release-${{ matrix.target }}-${{ env.TERMKEY_RELEASE_MODE }}
          path: artifacts/${{ matrix.archive }}
          if-no-files-found: error
  assemble:
    name: Verify complete release and prepare Homebrew
    needs:
      - validate
      - platforms
      - build
      - portable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Download every finalized archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: termkey-release-*-${{ env.TERMKEY_RELEASE_MODE }}
          path: artifacts
          merge-multiple: true
      - name: Generate complete checksums and formula
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          mapfile -t expected < <(node -e 'const fs=require("node:fs"); const targets=JSON.parse(fs.readFileSync("scripts/release-targets.json","utf8")); console.log([...targets.map(t=>t.archive),"termkey-macos-aarch64.dmg"].join("\n"));')
          node scripts/release-checksums.mjs artifacts artifacts/SHA256SUMS "${expected[@]}"
          (cd artifacts && sha256sum --check SHA256SUMS)
          node scripts/render-homebrew-formula.mjs "$RELEASE_VERSION" artifacts/SHA256SUMS Formula/termkey.rb
          ruby -c Formula/termkey.rb
      - name: Upload complete release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: termkey-ready-${{ env.TERMKEY_RELEASE_MODE }}
          path: artifacts/
          if-no-files-found: error
      - name: Upload prepared Homebrew formula
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: termkey-formula-${{ env.TERMKEY_RELEASE_MODE }}
          path: Formula/termkey.rb
          if-no-files-found: error
  release:
    name: Publish GitHub Release (tag-production)
    needs:
      - assemble
      - platforms
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Fail if release tag already exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_release_tags=$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name')
          if printf '%s\n' "$existing_release_tags" | grep -Fqx -- "$GITHUB_REF_NAME"; then
            echo "A release or draft already exists for tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Download public artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: termkey-ready-tag-production
          path: artifacts
      - name: Verify finalized checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS
      - name: Create draft Release
        id: create-draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and publish draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.create-draft.outputs.id }}
        run: |
          if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Draft action did not return a valid numeric release ID" >&2
            exit 1
          fi
          release_json="$RUNNER_TEMP/termkey-release-$GITHUB_RUN_ID.json"
          trap 'rm -f "$release_json"' EXIT
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > "$release_json"
          
          if [[ $(jq -r '.tag_name' "$release_json") != "$GITHUB_REF_NAME" ]]; then
            echo "Draft release tag did not match $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ $(jq -r '.draft' "$release_json") != 'true' ]]; then
            echo "Release for $GITHUB_REF_NAME was not an unpublished draft" >&2
            exit 1
          fi
          
          actual_assets=$(jq -r '.assets[].name' "$release_json" | LC_ALL=C sort)
          expected_assets=$(node -e 'const fs=require("node:fs"); const targets=JSON.parse(fs.readFileSync("scripts/release-targets.json","utf8")); console.log(["SHA256SUMS","termkey-macos-aarch64.dmg",...targets.map(t=>t.archive)].sort().join("\n"));')
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Draft release assets did not match the exact public manifest" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$actual_assets" >&2
            exit 1
          fi
          
          release_id=$(jq -r '.id' "$release_json")
          if [[ "$release_id" != "$RELEASE_ID" ]]; then
            echo "Queried draft release ID did not match the created release" >&2
            exit 1
          fi
          published_state=$(gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            --jq '.draft')
          if [[ "$published_state" != 'false' ]]; then
            echo "Release $release_id did not publish" >&2
            exit 1
          fi
  update-tap:
    name: Update Homebrew Tap (tag-production)
    needs: release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: termkey-formula-tag-production
          path: prepared-formula
      - name: Update only the prepared formula
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh auth setup-git
          git clone https://github.com/ryanonmars/homebrew-termkey.git tap
          mkdir -p tap/Formula
          cp prepared-formula/termkey.rb tap/Formula/termkey.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- Formula/termkey.rb
          if git diff --cached --quiet; then
            echo "Formula is already current."
          else
            git commit -m "termkey ${VERSION#v}"
            git push
          fi
