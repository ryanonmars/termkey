name: Native target validation

on:
  workflow_call:
    inputs:
      artifact_suffix:
        type: string
        default: ci

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MUSL_IMAGE: rust:1.93.0-alpine3.23@sha256:69d7b9d9aeaf108a1419d9a7fcf7860dcc043e9dbd1ab7ce88e44228774d99e9

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: targets
        shell: bash
        run: node -e 'const fs=require("node:fs"); const include=JSON.parse(fs.readFileSync("scripts/release-targets.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "matrix="+JSON.stringify({include})+"\n");'

  native:
    needs: plan
    name: Test and build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RUSTFLAGS: ${{ matrix.os == 'windows' && '-C target-feature=+crt-static' || '' }}
      TERMKEY_GRAPHICS: 'off'
      TERMKEY_SPLASH_MS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify native runner identity
        shell: bash
        env:
          EXPECTED_RUNNER_OS: ${{ matrix.os == 'macos' && 'macOS' || matrix.os == 'windows' && 'Windows' || 'Linux' }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.arch == 'arm64' && 'ARM64' || 'X64' }}
        run: |
          printf 'Native runner: %s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          test "$RUNNER_OS" = "$EXPECTED_RUNNER_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install native Rust
        if: matrix.os != 'linux'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.93.0'
          components: clippy
          targets: ${{ matrix.target }}
      - name: Check, test, lint, and build native target
        if: matrix.os != 'linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TERMKEY_PORTABILITY_OUT: ${{ github.workspace }}/portability/${{ matrix.target }}
        run: |
          rustc --verbose --version
          test "$(rustc --verbose --version | sed -n "s/^host: //p")" = "$TARGET"
          cargo check --locked --target "$TARGET" --workspace --all-targets --all-features
          cargo check --locked --target "$TARGET" --workspace --all-targets --no-default-features
          env -u TERMKEY_PORTABILITY_OUT cargo test --locked --target "$TARGET" --workspace --all-targets --all-features
          cargo clippy --locked --target "$TARGET" --workspace --all-targets --all-features -- -D warnings
          cargo build --locked --release --target "$TARGET" --bin termkey
          cargo test --locked --target "$TARGET" --test vault_portability -- --test-threads=1
      - name: Check, test, lint, and build MUSL target on native CPU
        if: matrix.os == 'linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e TARGET -e TERMKEY_GRAPHICS=off -e TERMKEY_SPLASH_MS=0 \
            -e TERMKEY_PORTABILITY_OUT="/workspace/portability/$TARGET" \
            "$MUSL_IMAGE" sh -eu -c '
              apk add --no-cache build-base linux-headers
              rustc --verbose --version
              test "$(rustc --verbose --version | sed -n "s/^host: //p")" = "$TARGET"
              cc --version
              uname -m
              rustup component add clippy
              cargo check --locked --target "$TARGET" --workspace --all-targets --all-features
              cargo check --locked --target "$TARGET" --workspace --all-targets --no-default-features
              env -u TERMKEY_PORTABILITY_OUT cargo test --locked --target "$TARGET" --workspace --all-targets --all-features
              cargo clippy --locked --target "$TARGET" --workspace --all-targets --all-features -- -D warnings
              cargo build --locked --release --target "$TARGET" --bin termkey
              cargo test --locked --target "$TARGET" --test vault_portability -- --test-threads=1
              cargo test --locked --release --target "$TARGET" --test clipboard_linux --no-run
              apk add --no-cache xvfb sway mesa-dri-gallium dbus font-dejavu libcap-utils
              adduser -D -u 1000 clipboardtest
              # Alpine gives Sway CAP_SYS_NICE, absent from the Docker bounding
              # set. Remove that capability instead of granting container privileges.
              setcap -r /usr/bin/sway
              count=0
              test_binary=""
              for candidate in target/"$TARGET"/release/deps/clipboard_linux-*; do
                if [ -f "$candidate" ] && [ -x "$candidate" ]; then
                  test_binary="/workspace/$candidate"
                  count=$((count + 1))
                fi
              done
              test "$count" = 1
              su -s /bin/sh clipboardtest -c "TERMKEY_TEST_CLIPBOARD_SANDBOX=1 scripts/test-linux-clipboard.sh $test_binary"
            '
      - name: Verify native Windows clipboard and interactive console
        if: matrix.os == 'windows'
        timeout-minutes: 5
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TERMKEY_TEST_WINDOWS_CLIPBOARD: '1'
          TERMKEY_TEST_WINDOWS_CONSOLE: '1'
        run: |
          cargo test --locked --target "$env:TARGET" --test clipboard_windows -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-windows-terminal.py --binary "target/$env:TARGET/release/termkey.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Make synthetic fixtures readable by artifact uploader
        if: matrix.os == 'linux'
        shell: bash
        run: sudo chown -hR "$(id -u):$(id -g)" portability
      - name: Upload native binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termkey-binary-${{ matrix.target }}-${{ inputs.artifact_suffix }}
          path: target/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error
      - name: Upload synthetic vault fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termkey-fixtures-${{ matrix.target }}-${{ inputs.artifact_suffix }}
          path: portability/${{ matrix.target }}/
          if-no-files-found: error

  portability:
    needs: [plan, native]
    name: Read every platform vault on ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RUSTFLAGS: ${{ matrix.os == 'windows' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify native runner identity
        shell: bash
        env:
          EXPECTED_RUNNER_OS: ${{ matrix.os == 'macos' && 'macOS' || matrix.os == 'windows' && 'Windows' || 'Linux' }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.arch == 'arm64' && 'ARM64' || 'X64' }}
        run: |
          printf 'Native runner: %s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          test "$RUNNER_OS" = "$EXPECTED_RUNNER_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
      - name: Download every synthetic fixture bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: termkey-fixtures-*-${{ inputs.artifact_suffix }}
          path: foreign-fixtures
      - name: Install native Rust
        if: matrix.os != 'linux'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.93.0'
          targets: ${{ matrix.target }}
      - name: Verify cross-platform production vaults
        if: matrix.os != 'linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TERMKEY_PORTABILITY_INPUT: ${{ github.workspace }}/foreign-fixtures
          TERMKEY_PORTABILITY_EXPECT_BUNDLES: '5'
        run: |
          rustc --verbose --version
          test "$(rustc --verbose --version | sed -n "s/^host: //p")" = "$TARGET"
          cargo test --locked --target "$TARGET" --test vault_portability -- --test-threads=1
      - name: Verify cross-platform production vaults with MUSL
        if: matrix.os == 'linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e TARGET -e TERMKEY_PORTABILITY_INPUT=/workspace/foreign-fixtures \
            -e TERMKEY_PORTABILITY_EXPECT_BUNDLES=5 \
            "$MUSL_IMAGE" sh -eu -c '
              apk add --no-cache build-base linux-headers
              rustc --verbose --version
              test "$(rustc --verbose --version | sed -n "s/^host: //p")" = "$TARGET"
              cargo test --locked --target "$TARGET" --test vault_portability -- --test-threads=1
            '
